name: 실시간 점수 테스트

on:
  schedule:
    - cron: "2-59/5 9-14 * * *"   # 매일 18:02~23:57(한국) 5분마다 (수집 작업과 2분 어긋나게)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python live_probe.py

      - name: 기록 올리기
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add probe/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실시간 점수 테스트 $(date '+%H:%M')"
            git pull --rebase
            git push
          fi
