name: 경기 데이터 수집

on:
  schedule:
    # GitHub 시간은 UTC 기준 (한국 시간 = UTC + 9시간)
    - cron: "0 20 * * *"       # 매일 새벽 5시(한국) 시즌 전체 수집
    - cron: "*/5 7-14 * * *"   # 매일 16:00~23:55(한국) 5분마다 오늘 경기 갱신
  workflow_dispatch:            # Actions 화면에서 직접 실행하는 버튼
    inputs:
      mode:
        description: "full = 전체 수집, live = 오늘 경기만"
        default: "full"

permissions:
  contents: write               # 결과 파일을 저장소에 올리기 위한 권한

concurrency:
  group: collect                # 두 작업이 동시에 파일을 올리다 충돌하는 것을 막음
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04   # 버전 고정
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 실행
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            MODE=full
          else
            MODE=live
          fi
          echo "실행 방식: $MODE"
          python main.py "$MODE"

      - name: 바뀐 파일이 있으면 저장소에 올리기
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add games_*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "경기 데이터 갱신 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
